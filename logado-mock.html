<!DOCTYPE html>

  <link rel="icon" href="public/imagens/icon.png">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { spotify: '#1DB954' } } } }
  </script>
  <style type="text/tailwindcss">
    /* Mantém a coluna fixa no topo, mas sem grid-span pois main não é mais grid */
    .titulo-secao { @apply sticky top-0 bg-white text-center font-bold text-xl py-4 mb-6 text-gray-900 z-10; }
    /* Cards com padding maior, largura controlada pelo container 'main', borda suave e altura mínima */
    .items { @apply flex items-center bg-white shadow-md rounded-lg p-6 transition hover:shadow-lg space-x-4 border border-gray-200 min-h-[128px] w-[300px] mx-auto; }
    
    /* Media queries para responsividade dos cards */
    @media (min-width: 640px) {
      .items { @apply w-[400px]; }
    }
    @media (min-width: 1024px) {
      .items { @apply w-[500px]; }
    }
    .items img { @apply h-16 w-16 object-cover rounded-md flex-shrink-0; }
    .numero { @apply inline-flex items-center justify-center h-6 w-6 bg-spotify text-white font-bold rounded-full mr-2 text-sm flex-shrink-0; }
    /* Container para nome da faixa e artista - sempre coluna */
    .item-text { @apply flex-grow flex flex-col min-w-0; }
    .track-name { @apply font-semibold text-gray-900 truncate overflow-hidden; }
    /* Nome/Gênero do artista sempre abaixo com margem superior */
    .artist-name { @apply text-gray-500 text-sm mt-1 truncate overflow-hidden; }
    #menus { @apply w-full bg-white border-b border-gray-200; }
    #menus button { @apply py-3 px-4 text-sm font-medium text-gray-700 hover:text-gray-900 transition; }
    #menus button.ativo { @apply border-b-2 border-spotify text-gray-900; }
    /* Main com largura máxima reduzida, SEM items-center */
    main { @apply flex-1 max-w-lg mx-auto px-6 py-8 flex flex-col space-y-4; }
    /* Header py-6 (igual index.html), SEM sombra */
    header { @apply bg-white py-6; }
    /* Logo h-10 (igual index.html), removido w-auto para seguir index.html */
    header a img.logo { @apply h-10; }
    /* Ícones sociais h-6 w-6 (igual index.html) */
    header div a img.social-icon { @apply h-6 w-6; }
  </style>
</head>
