<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Site baseado na API do Spotify que mostra seus artistas e faixas favoritos">
    <meta name="keywords" content="spotify, api, artista favoritos, faixas favoritas">
    <meta name="author" content="Pedro Haubert">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semaninha | Seus Favoritos</title>
    <link rel="icon" href="public/imagens/icon.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        spotify: '#1DB954',
                    },
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        .titulo-secao { @apply sticky top-0 bg-white text-center font-bold text-xl py-4 mb-6 text-gray-900 z-10; }
        /* Cards com padding maior, largura controlada pelo container 'main', borda suave e altura mínima */
        .items { @apply flex items-center bg-white shadow-md rounded-lg p-6 transition hover:shadow-lg space-x-4 border border-gray-200 min-h-[128px] w-[300px] mx-auto; }
        
        /* Media queries para responsividade dos cards */
        @media (min-width: 640px) {
          .items { @apply w-[400px]; }
        }
        @media (min-width: 1024px) {
          .items { @apply w-[500px]; }
        }
        .items img { @apply h-16 w-16 object-cover rounded-md flex-shrink-0; }
        .numero { @apply inline-flex items-center justify-center h-6 w-6 bg-spotify text-white font-bold rounded-full mr-2 text-sm flex-shrink-0; }
        .item-text { @apply flex-grow flex flex-col min-w-0; }
        .track-name { @apply font-semibold text-gray-900 truncate overflow-hidden; }
        .artist-name { @apply text-gray-500 text-sm mt-1 truncate overflow-hidden; }
        #menus { @apply w-full bg-white border-b border-gray-200; }
        #menus button { @apply py-3 px-4 text-sm font-medium text-gray-700 hover:text-gray-900 transition; }
        #menus button.ativo { @apply border-b-2 border-spotify text-gray-900; }
        main { @apply flex-1 max-w-lg mx-auto px-6 py-8 flex flex-col space-y-4; }
        header { @apply bg-white py-6; }
        header a img.logo { @apply h-10; }
        header div a img.social-icon { @apply h-6 w-6; }
    </style>
</head>
<body class="bg-white text-gray-900 flex flex-col min-h-screen" onload="paginaCarregada();">
    <header class="py-6 bg-white">
        <div class="container mx-auto px-6 max-w-6xl flex justify-between items-center">
            <a href="index.html" class="block">
                <img src="public/imagens/icon.png" alt="logo semaninha" class="h-10 logo">
            </a>
            <div class="flex space-x-4">
                <a href="https://www.instagram.com/pedroh4ubert/" class="text-gray-600 hover:text-gray-900">
                    <img src="public/imagens/1161953_instagram_icon.png" alt="Instagram" class="h-6 w-6 social-icon">
                </a>
                <a href="https://github.com/pedroohaubert" class="text-gray-600 hover:text-gray-900">
                    <img src="public/imagens/1964417_github_logo_media_social_icon.png" alt="GitHub" class="h-6 w-6 social-icon">
                </a>
                <a href="https://www.linkedin.com/in/pedro-haubert-3a971a293/" class="text-gray-600 hover:text-gray-900">
                    <img src="public/imagens/104828_linked_in_linked in_icon.png" alt="LinkedIn" class="h-6 w-6 social-icon">
                </a>
            </div>
        </div>
    </header>
    <nav id="menus">
        <div class="max-w-lg mx-auto px-6 flex justify-center space-x-4">
            <button id="botaoFaixas" onclick="selecionarFaixas()">Faixas</button>
            <button id="botaoArtistas" onclick="selecionarArtistas()">Artistas</button>
        </div>
    </nav>
    <main id="box">
        <!-- Conteúdo gerado via JS -->
    </main>
    <script src="public/js/script.js"></script>
</body>
</html>
